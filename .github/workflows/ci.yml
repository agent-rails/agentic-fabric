name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Parse every shell script
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Install agent-guard for the policy suite
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/guard"
          "$RUNNER_TEMP/guard/bin/pip" install --quiet "git+https://github.com/agent-rails/agent-guard@d5c12a9b6426a8f30f3c4216d0c702ac6e751d79"
          echo "$RUNNER_TEMP/guard/bin" >> "$GITHUB_PATH"

      - name: Run the script test suites
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(scripts/*.test.sh)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no scripts/*.test.sh found; this job must not pass by finding nothing to run" >&2
            exit 1
          fi
          for f in "${suites[@]}"; do
            echo "--- $f"
            bash "$f"
          done
