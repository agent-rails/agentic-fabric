name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse every shell script
        run: |
          set -euo pipefail
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: Run every plugin test suite
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(plugins/*/tests/*.test.sh)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no plugin test suites found; this job must not pass by finding nothing to run" >&2
            exit 1
          fi
          for suite in "${suites[@]}"; do
            echo "--- $suite"
            bash "$suite"
          done

      - name: Scan the tree for private data and credentials
        run: python3 -I scripts/leak-scan.py tree HEAD^{tree} --identity 50994984+voltagebots@users.noreply.github.com
